<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Example</title>

    <style>
        .container {
            display: flex;
            border: 2px solid black;
            padding: 10px;
            width: 500px;
        }

        .box {
            width: 100px;
            padding: 20px;
            margin: 10px;
            border: 2px solid black;
            text-align: center;
        }
        .box img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box"> <img src="https://shorturl.at/gQNhr" alt="Imagem de Exemplo"> </div>

        <div class="box"> <img src="https://shorturl.at/0jHns" alt="Imagem de Exemplo"> </div>

        <div class="box"> <img src="https://shorturl.at/wI5oL" alt="Imagem de Exemplo"></div>

    </div>

</body>
</html>
