<!DOCTYPE html>
<html>
<head>
    <title>Exemplo de Texto em CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: green;
            margin: 20px;
        }
        h1 {
            font-size: 36px;
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 2px 2px 4px gray;
            color: darkblue;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            text-align: center;
            background-color: orange;
        }
    </style>
</head>

<body>

    <h1>Meu Website</h1>

    <p>
        Este é um simples parágrafo mostrando as propriedades de texto do CSS.
        <br>
        A propriedade "line-height" aumenta o espaçamento entre as linhas para melhorar a leitura.
    </p>

</body>
</html>
