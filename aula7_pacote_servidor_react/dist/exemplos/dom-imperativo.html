<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparação — DOM imperativo</title>
  <style>
    body { font-family: Lato, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #20242b; }
    .painel { border: 1px solid #d9dee7; border-radius: 1rem; padding: 1rem; }
    button { background: #6f42c1; color: white; border: 0; border-radius: .5rem; padding: .65rem 1rem; cursor: pointer; }
    pre { background: #f1ecfa; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>DOM imperativo × React declarativo</h1>
  <p>Nesta versão, o código precisa localizar e atualizar manualmente cada parte da interface.</p>
  <div class="painel">
    <p>Itens no carrinho: <strong id="badge">0</strong></p>
    <button id="adicionar" type="button">Adicionar teclado</button>
    <p id="feedback" role="status"></p>
  </div>
  <pre><code>const badge = document.querySelector('#badge');
badge.textContent = carrinho.length;</code></pre>
  <p><a href="../../">Voltar à versão React</a></p>
  <script>
    const carrinho = [];
    const produto = { id: 1, nome: 'Teclado Mecânico', preco: 199.9 };
    const badge = document.querySelector('#badge');
    const feedback = document.querySelector('#feedback');

    document.querySelector('#adicionar').addEventListener('click', () => {
      carrinho.push(produto);
      badge.textContent = carrinho.length;
      feedback.textContent = produto.nome + ' foi adicionado.';
    });
  </script>
</body>
</html>
