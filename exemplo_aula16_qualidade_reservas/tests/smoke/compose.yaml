services:
  db:
    image: mariadb:10.5
    environment:
      MARIADB_DATABASE: aula16_smoke
      MARIADB_USER: aula16
      MARIADB_PASSWORD: somente-smoke-local
      MARIADB_ROOT_PASSWORD: somente-smoke-root
    volumes:
      - ../../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "aula16", "-psomente-smoke-local"]
      interval: 2s
      timeout: 2s
      retries: 30
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18016:80"
    volumes:
      - ../../dist:/var/www/html/campus/departamento/aula16:ro
      - ./config.php:/var/www/html/campus/departamento/aula16/api/config.php:ro
